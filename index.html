<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BusetaGo · Demo de rastreo en tiempo real</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --petrol:#0C1B26;
    --petrol-2:#12303f;
    --ink:#E7EEF2;
    --muted:#8CA0AD;
    --line:rgba(255,255,255,.10);
    --amber:#F5A524;
    --emerald:#0E9F6E;
    --teal:#3B9E82;
    --iris:#7B9CF0;
    --live:#2fd36f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--petrol);color:var(--ink);overflow:hidden;
  }
  #map{position:absolute;inset:0;background:#dfe6ea;z-index:1}

  /* ---------- Top bar ---------- */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;
    background:linear-gradient(180deg,rgba(12,27,38,.96),rgba(12,27,38,.82) 70%,rgba(12,27,38,0));
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px;font-size:17px}
  .brand .glyph{
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:var(--amber);color:#241a00;font-size:17px;
    box-shadow:0 4px 14px rgba(245,165,36,.35)
  }
  .brand small{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.5px}
  .live{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    background:rgba(47,211,111,.12);border:1px solid rgba(47,211,111,.35);
    color:#9ff0bf;font-size:11px;font-weight:700;letter-spacing:.6px;
    padding:5px 10px;border-radius:999px
  }
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(47,211,111,.7);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,211,111,.55)}70%{box-shadow:0 0 0 9px rgba(47,211,111,0)}100%{box-shadow:0 0 0 0 rgba(47,211,111,0)}}
  .clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;font-weight:600}

  /* ---------- Role switch ---------- */
  .role{
    position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:1000;
    display:flex;background:rgba(12,27,38,.9);border:1px solid var(--line);
    border-radius:999px;padding:4px;backdrop-filter:blur(6px)
  }
  .role button{
    border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;
    padding:8px 18px;border-radius:999px;cursor:pointer;transition:.18s;letter-spacing:.2px
  }
  .role button.on{background:var(--amber);color:#241a00}

  /* ---------- Bottom sheet ---------- */
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:1000;
    background:var(--petrol);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    box-shadow:0 -18px 40px rgba(0,0,0,.4);
    max-height:52vh;display:flex;flex-direction:column;
  }
  @media(min-width:820px){
    .sheet{left:14px;bottom:14px;right:auto;width:370px;border-radius:18px;border:1px solid var(--line);max-height:calc(100vh - 90px)}
  }
  .handle{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin:9px auto 4px}
  .sheet-head{padding:4px 18px 12px;border-bottom:1px solid var(--line)}
  .sheet-head h2{margin:0;font-size:16px;letter-spacing:.2px}
  .sheet-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.35}
  .sheet-body{padding:12px 14px 16px;overflow-y:auto}

  .actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .btn{
    flex:1;min-width:130px;border:1px solid var(--line);background:var(--petrol-2);
    color:var(--ink);font-weight:700;font-size:13px;padding:11px 12px;border-radius:12px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s
  }
  .btn:hover{border-color:rgba(255,255,255,.28)}
  .btn.primary{background:var(--amber);color:#241a00;border-color:transparent}
  .btn.primary.armed{background:#ffd67a;animation:blink 1.1s infinite}
  @keyframes blink{50%{filter:brightness(1.08)}}
  .btn.ghost{background:transparent}

  /* list cards */
  .card{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;
    background:var(--petrol-2);border:1px solid var(--line);margin-bottom:9px;cursor:pointer;transition:.15s
  }
  .card:hover{border-color:rgba(255,255,255,.24);transform:translateY(-1px)}
  .badge{
    width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
    font-size:19px;flex:none;color:#0b1620;font-weight:800
  }
  .card .meta{min-width:0;flex:1}
  .card .meta .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta .s{color:var(--muted);font-size:12px;margin-top:2px}
  .eta{text-align:right;flex:none}
  .eta .n{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .eta .u{color:var(--muted);font-size:10.5px;letter-spacing:.4px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    color:#9ff0bf;background:rgba(47,211,111,.12);border:1px solid rgba(47,211,111,.3);
    padding:2px 7px;border-radius:99px}
  .pill .d{width:6px;height:6px;border-radius:50%;background:var(--live)}

  /* register form */
  .form{display:none;gap:8px;flex-direction:column;background:var(--petrol-2);
    border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:12px}
  .form.show{display:flex}
  .form label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px;margin-bottom:-3px}
  .form input,.form select{
    background:var(--petrol);border:1px solid var(--line);color:var(--ink);
    padding:10px;border-radius:10px;font-size:13.5px;font-family:inherit;width:100%
  }
  .form input:focus,.form select:focus{outline:none;border-color:var(--amber)}

  .switchrow{display:flex;align-items:center;justify-content:space-between;
    background:var(--petrol-2);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:12px}
  .switchrow .l .t{font-weight:700;font-size:13px}
  .switchrow .l .s{color:var(--muted);font-size:11.5px;margin-top:2px}
  .toggle{width:46px;height:26px;border-radius:99px;background:#33454f;position:relative;cursor:pointer;flex:none;transition:.2s;border:0}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .toggle.on{background:var(--emerald)}
  .toggle.on::after{left:23px}

  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 8px;line-height:1.5}
  .hint{color:var(--muted);font-size:11.5px;margin:2px 0 10px;line-height:1.4}

  /* Leaflet marker skins */
  .bus-badge{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    background:var(--c,#F5A524);font-size:19px;
    box-shadow:0 3px 10px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.85);
    position:relative
  }
  .bus-badge::before{content:"";position:absolute;inset:-6px;border-radius:50%;
    border:2px solid var(--c,#F5A524);opacity:.55;animation:ring 1.8s infinite}
  @keyframes ring{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.3);opacity:0}}
  .wait-pin{width:34px;height:34px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);
    background:var(--teal);display:grid;place-items:center;
    box-shadow:0 3px 8px rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.85)}
  .wait-pin span{transform:rotate(-45deg);font-size:16px}
  .leaflet-popup-content-wrapper{background:var(--petrol);color:var(--ink);border-radius:12px}
  .leaflet-popup-tip{background:var(--petrol)}
  .leaflet-popup-content{margin:11px 13px;font-size:13px;line-height:1.5}
  .leaflet-popup-content b{color:var(--amber)}
  .leaflet-container{font-family:inherit}

  /* ---------- name modal + login ---------- */
  .modal{position:absolute;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;
    background:rgba(6,14,20,.6);backdrop-filter:blur(3px);padding:20px}
  .modal.show{display:flex}
  .modal-card{width:100%;max-width:340px;background:var(--petrol);border:1px solid var(--line);
    border-radius:18px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .modal-card h3{margin:0 0 4px;font-size:17px}
  .modal-card p{margin:0 0 14px;color:var(--muted);font-size:12.5px;line-height:1.4}
  .modal-card input{width:100%;background:var(--petrol-2);border:1px solid var(--line);color:var(--ink);
    padding:12px;border-radius:11px;font-size:14px;font-family:inherit}
  .modal-card input:focus{outline:none;border-color:var(--amber)}
  .modal-actions{display:flex;gap:8px;margin-top:14px}
  .lock{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;
    background:var(--petrol-2);border:1px solid var(--line);margin:0 auto 12px}
  .err{color:#ff9a8a;font-size:12px;margin-top:8px;min-height:14px;text-align:center}
  .logout{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:14px;text-decoration:none}
  .logout:hover{color:var(--amber)}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand"><span class="glyph">🚐</span><div>BusetaGo<br><small>DEMO · RASTREO EN VIVO</small></div></div>
  <div class="live"><span class="dot"></span>EN VIVO</div>
</div>

<div class="role">
  <button id="roleClient" class="on">Cliente</button>
  <button id="roleDriver">Conductor</button>
</div>

<div class="sheet">
  <div class="handle"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Busetas en vivo</h2>
    <p id="sheetSub">Mirá por dónde viene tu buseta y marcá dónde estás esperando.</p>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="modal" id="nameModal">
  <div class="modal-card">
    <h3>¿Quién espera aquí?</h3>
    <p>Indicá tu nombre para que el conductor sepa a quién recoger.</p>
    <input id="pinName" placeholder="Ej: Ana Solís" autocomplete="off"/>
    <div class="modal-actions">
      <button class="btn ghost" id="pinCancel">Cancelar</button>
      <button class="btn primary" id="pinOk">Marcar mi punto</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ============================================================
   BusetaGo — prototipo de rastreo en tiempo real (single-file demo)
   - Rutas y busetas simuladas moviéndose sobre un mapa real (GAM, CR)
   - Cliente: marca puntos de espera y ve ETA por buseta
   - Conductor: se registra, elige buseta y puede compartir GPS real
   ============================================================ */

const map = L.map('map', { zoomControl:false }).setView([9.938, -84.083], 13);
L.control.zoom({ position:'topright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);

const ROUTES = {
  A:{ name:'Ruta Norte · San José ⇄ Heredia',  color:'#F5A524',
      path:[[9.9333,-84.0783],[9.9450,-84.0850],[9.9600,-84.0950],[9.9750,-84.1050],[9.9980,-84.1170]] },
  B:{ name:'Ruta Oeste · San José ⇄ Santa Ana', color:'#3B9E82',
      path:[[9.9333,-84.0783],[9.9280,-84.0950],[9.9250,-84.1100],[9.9200,-84.1300],[9.9330,-84.1550]] },
  C:{ name:'Ruta Este · San José ⇄ Tres Ríos',  color:'#7B9CF0',
      path:[[9.9333,-84.0783],[9.9250,-84.0650],[9.9180,-84.0500],[9.9130,-84.0350],[9.9080,-84.0180]] },
};

// draw routes faintly
for(const k in ROUTES){
  L.polyline(ROUTES[k].path,{color:ROUTES[k].color,weight:4,opacity:.35}).addTo(map);
}

let seq = 0;
const buses = [];
function makeBus(driver, plate, routeKey, p0){
  const b = { id:'b'+(++seq), driver, plate, routeKey,
              p:(p0??Math.random()*3), dir:Math.random()<.5?1:-1,
              speed:0.055+Math.random()*0.02, gps:false, marker:null };
  const c = ROUTES[routeKey].color;
  b.marker = L.marker(posOf(b), {
    icon:L.divIcon({className:'',html:`<div class="bus-badge" style="--c:${c}">🚐</div>`,
                    iconSize:[38,38],iconAnchor:[19,19]}), zIndexOffset:500
  }).addTo(map);
  b.marker.on('click',()=>focusBus(b));
  buses.push(b); return b;
}
// starting fleet — three registered drivers
makeBus('Marco Jiménez','SJB-472','A',0.4);
makeBus('Silvia Rojas','CB-1180','B',1.6);
makeBus('Diego Castro','HB-905','C',2.3);

function posOf(b){
  const path = ROUTES[b.routeKey].path;
  let seg = Math.floor(b.p); let t = b.p-seg;
  if(seg>=path.length-1){seg=path.length-2;t=1;}
  const a=path[seg], c=path[seg+1];
  return [a[0]+(c[0]-a[0])*t, a[1]+(c[1]-a[1])*t];
}
function stepBus(b){
  if(b.gps) return;
  const path = ROUTES[b.routeKey].path;
  b.p += b.speed*b.dir;
  if(b.p>=path.length-1){b.p=path.length-1;b.dir=-1;}
  if(b.p<=0){b.p=0;b.dir=1;}
  b.marker.setLatLng(posOf(b));
}
function haversine(a,b){
  const R=6371,d=x=>x*Math.PI/180;
  const dLat=d(b[0]-a[0]),dLng=d(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(d(a[0]))*Math.cos(d(b[0]))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
const AVG_KMH=24;
function etaMin(from,to){ return Math.max(1,Math.round(haversine(from,to)/AVG_KMH*60)); }

/* -------- waiting pins (clientes esperando) -------- */
const pins = [];
let placing = false;
function addPin(lat,lng,name){
  const nm = (name&&name.trim()) ? name.trim() : ('Pasajero '+(pins.length+1));
  const p={ id:pins.length+1, lat, lng, name:nm, marker:null };
  p.marker = L.marker([lat,lng],{
    icon:L.divIcon({className:'',html:`<div class="wait-pin"><span>🙋</span></div>`,
                    iconSize:[34,34],iconAnchor:[6,32]})
  }).addTo(map).bindPopup(`<b>${nm}</b><br>Esperando aquí`);
  pins.push(p); render();
}

/* ask for the passenger name before dropping the pin */
let pendingLoc=null;
function askName(lat,lng){
  pendingLoc={lat,lng};
  const inp=document.getElementById('pinName');
  inp.value=''; document.getElementById('nameModal').classList.add('show');
  setTimeout(()=>inp.focus(),50);
}
function confirmPin(){
  if(!pendingLoc) return;
  addPin(pendingLoc.lat,pendingLoc.lng,document.getElementById('pinName').value);
  document.getElementById('nameModal').classList.remove('show'); pendingLoc=null;
}
document.getElementById('pinOk').onclick=confirmPin;
document.getElementById('pinCancel').onclick=()=>{document.getElementById('nameModal').classList.remove('show');pendingLoc=null;};
document.getElementById('pinName').addEventListener('keydown',e=>{if(e.key==='Enter')confirmPin();});

map.on('click',e=>{
  if(placing){ askName(e.latlng.lat,e.latlng.lng); }
});
function clearPins(){ pins.forEach(p=>map.removeLayer(p.marker)); pins.length=0; render(); }

function focusBus(b){ map.flyTo(b.marker.getLatLng(),15,{duration:.6});
  b.marker.bindPopup(`<b>${b.driver}</b><br>${b.plate} · ${ROUTES[b.routeKey].name.split('·')[0].trim()}`).openPopup(); }

/* ---------------- UI state ---------------- */
let role='cliente';
let myBusId=null;      // conductor's selected bus
let showForm=false;
const DRIVER_KEY='buseta2026';   // clave de acceso de conductores (demo)
let driverAuth=false;

const $ = s=>document.querySelector(s);
$('#roleClient').onclick=()=>setRole('cliente');
$('#roleDriver').onclick=()=>setRole('conductor');
function setRole(r){
  role=r; placing=false;
  $('#roleClient').classList.toggle('on',r==='cliente');
  $('#roleDriver').classList.toggle('on',r==='conductor');
  render();
}

function render(){
  const body=$('#sheetBody');
  if(role==='cliente') renderClient(body); else renderDriver(body);
}

function renderClient(body){
  $('#sheetTitle').textContent='Busetas en vivo';
  $('#sheetSub').textContent='Mirá por dónde viene tu buseta y marcá dónde estás esperando.';
  const ref = pins.length ? [pins[pins.length-1].lat,pins[pins.length-1].lng] : null;

  let html = `<div class="actions">
    <button class="btn primary ${placing?'armed':''}" id="place">${placing?'Tocá el mapa 👆':'📍 Marcar dónde espero'}</button>
    <button class="btn ghost" id="geo">🛰️ Usar mi ubicación</button>
  </div>`;
  html += pins.length
    ? `<div class="hint">${pins.length} punto(s) de espera marcado(s). El ETA se calcula al más reciente. <a href="#" id="clr" style="color:var(--amber)">Limpiar</a></div>`
    : `<div class="hint">Aún no marcás dónde esperás. Los tiempos abajo son estimados a tu punto una vez marcado.</div>`;

  buses.forEach(b=>{
    const c=ROUTES[b.routeKey].color;
    const eta = ref ? etaMin(b.marker.getLatLng(),ref) : null;
    html += `<div class="card" data-focus="${b.id}">
      <div class="badge" style="background:${c}">🚐</div>
      <div class="meta">
        <div class="t">${ROUTES[b.routeKey].name.split('·')[0].trim()}</div>
        <div class="s">${b.driver} · ${b.plate} <span class="pill" style="margin-left:4px"><span class="d"></span>${b.gps?'GPS':'EN VIVO'}</span></div>
      </div>
      <div class="eta">${eta?`<div class="n">${eta}</div><div class="u">MIN</div>`:`<div class="u" style="font-size:11px">EN<br>RUTA</div>`}</div>
    </div>`;
  });
  body.innerHTML=html;

  $('#place').onclick=()=>{ placing=!placing; render(); };
  $('#geo').onclick=useMyLocation;
  if($('#clr')) $('#clr').onclick=e=>{e.preventDefault();clearPins();};
  body.querySelectorAll('[data-focus]').forEach(el=>el.onclick=()=>{
    focusBus(buses.find(b=>b.id===el.dataset.focus));
  });
}

function useMyLocation(){
  if(!navigator.geolocation){ alert('Tu navegador no soporta geolocalización.'); return; }
  navigator.geolocation.getCurrentPosition(
    p=>{ map.flyTo([p.coords.latitude,p.coords.longitude],15); askName(p.coords.latitude,p.coords.longitude); },
    ()=>alert('No pudimos obtener tu ubicación (permiso denegado o no disponible en la demo).')
  );
}

function renderDriver(body){
  if(!driverAuth){ renderDriverLogin(body); return; }
  $('#sheetTitle').textContent='Modo conductor';
  $('#sheetSub').textContent='Registrate, elegí tu buseta y compartí tu ubicación con los pasajeros.';
  const my = buses.find(b=>b.id===myBusId);

  let html = `<div class="actions">
    <button class="btn ${showForm?'ghost':'primary'}" id="toggleForm">${showForm?'Cerrar':'➕ Registrar conductor'}</button>
  </div>`;

  html += `<div class="form ${showForm?'show':''}" id="regForm">
    <label>Nombre del conductor</label><input id="fName" placeholder="Ej: Laura Vargas"/>
    <label>Placa</label><input id="fPlate" placeholder="Ej: BUS-330"/>
    <label>Ruta</label>
    <select id="fRoute">
      <option value="A">Ruta Norte · San José ⇄ Heredia</option>
      <option value="B">Ruta Oeste · San José ⇄ Santa Ana</option>
      <option value="C">Ruta Este · San José ⇄ Tres Ríos</option>
    </select>
    <button class="btn primary" id="fSave" style="margin-top:4px">Registrar y salir a ruta</button>
  </div>`;

  html += `<div class="hint">Elegí cuál buseta manejás hoy:</div>`;
  buses.forEach(b=>{
    const c=ROUTES[b.routeKey].color; const sel=b.id===myBusId;
    html += `<div class="card" data-pick="${b.id}" style="${sel?'border-color:'+c:''}">
      <div class="badge" style="background:${c}">🚐</div>
      <div class="meta"><div class="t">${b.driver} ${sel?'· (vos)':''}</div>
      <div class="s">${b.plate} · ${ROUTES[b.routeKey].name.split('·')[0].trim()}</div></div>
      <div class="eta"><div class="u" style="font-size:11px">${sel?'ACTIVA':'ELEGIR'}</div></div>
    </div>`;
  });

  if(my){
    html += `<div class="switchrow" style="margin-top:12px">
      <div class="l"><div class="t">Compartir mi ubicación (GPS real)</div>
      <div class="s">${my.gps?'Transmitiendo tu posición real':'Usando posición simulada'}</div></div>
      <button class="toggle ${my.gps?'on':''}" id="gpsTgl"></button>
    </div>`;
    html += `<div class="hint">Pasajeros esperando en tu ruta:</div>`;
    if(pins.length===0){
      html += `<div class="empty">Nadie ha marcado un punto todavía.<br>Cambiá a <b>Cliente</b> y tocá el mapa para simularlo.</div>`;
    } else {
      pins.forEach(p=>{
        const eta=etaMin(my.marker.getLatLng(),[p.lat,p.lng]);
        html += `<div class="card" data-pin="${p.id}">
          <div class="badge" style="background:var(--teal)">🙋</div>
          <div class="meta"><div class="t">${p.name}</div>
          <div class="s">${haversine(my.marker.getLatLng(),[p.lat,p.lng]).toFixed(1)} km de distancia</div></div>
          <div class="eta"><div class="n">${eta}</div><div class="u">MIN</div></div>
        </div>`;
      });
    }
  } else {
    html += `<div class="empty" style="margin-top:8px">Elegí una buseta arriba para empezar a transmitir.</div>`;
  }
  body.innerHTML=html;

  $('#toggleForm').onclick=()=>{ showForm=!showForm; render(); };
  if($('#fSave')) $('#fSave').onclick=()=>{
    const n=$('#fName').value.trim(), pl=$('#fPlate').value.trim(), rt=$('#fRoute').value;
    if(!n||!pl){ alert('Completá nombre y placa.'); return; }
    const b=makeBus(n,pl,rt,0); myBusId=b.id; showForm=false;
    focusBus(b); render();
  };
  body.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{
    myBusId=el.dataset.pick; const b=buses.find(x=>x.id===myBusId); focusBus(b); render();
  });
  body.querySelectorAll('[data-pin]').forEach(el=>el.onclick=()=>{
    const p=pins.find(x=>x.id==el.dataset.pin); map.flyTo([p.lat,p.lng],15);
  });
  if($('#gpsTgl')) $('#gpsTgl').onclick=()=>toggleGps(my);

  body.insertAdjacentHTML('beforeend','<a href="#" class="logout" id="logout">Cerrar sesión de conductor</a>');
  $('#logout').onclick=e=>{e.preventDefault();driverAuth=false;render();};
}

function renderDriverLogin(body){
  $('#sheetTitle').textContent='Acceso conductor';
  $('#sheetSub').textContent='Ingresá tu clave para administrar tu buseta.';
  body.innerHTML=`
    <div class="form show" style="align-items:stretch">
      <div class="lock">🔒</div>
      <label>Clave de acceso</label>
      <input id="drvKey" type="password" placeholder="••••••••" autocomplete="off"/>
      <button class="btn primary" id="drvEnter" style="margin-top:4px">Ingresar</button>
      <div class="err" id="drvErr"></div>
    </div>
    <div class="hint" style="text-align:center">Clave de demo: <b style="color:var(--amber)">buseta2026</b></div>`;
  const go=()=>{
    if($('#drvKey').value===DRIVER_KEY){ driverAuth=true; render(); }
    else { $('#drvErr').textContent='Clave incorrecta. Intentá de nuevo.'; $('#drvKey').value=''; $('#drvKey').focus(); }
  };
  $('#drvEnter').onclick=go;
  $('#drvKey').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  setTimeout(()=>$('#drvKey').focus(),50);
}

let watchId=null;
function toggleGps(b){
  if(!b) return;
  if(b.gps){ b.gps=false; if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;} render(); return; }
  if(!navigator.geolocation){ alert('Sin soporte de GPS en este navegador.'); return; }
  watchId=navigator.geolocation.watchPosition(
    p=>{ b.gps=true; b.marker.setLatLng([p.coords.latitude,p.coords.longitude]);
         map.flyTo([p.coords.latitude,p.coords.longitude],15); render(); },
    ()=>{ alert('No se pudo activar el GPS (permiso denegado). En la demo seguimos con posición simulada.'); },
    { enableHighAccuracy:true, maximumAge:2000 }
  );
}

/* clock + animation loop */
function tick(){ buses.forEach(stepBus); if(role==='cliente') render(); }
setInterval(tick,1000);
setInterval(()=>{ $('.live')&&0; },1000);
function clock(){ const d=new Date();
  document.title='BusetaGo · '+d.toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'}); }
setInterval(clock,1000); clock();

render();
</script>
