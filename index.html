<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BusetaGo · Rastreo en tiempo real</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --petrol:#0C1B26;
    --petrol-2:#12303f;
    --ink:#E7EEF2;
    --muted:#8CA0AD;
    --line:rgba(255,255,255,.10);
    --amber:#F5A524;
    --emerald:#0E9F6E;
    --teal:#3B9E82;
    --iris:#7B9CF0;
    --live:#2fd36f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--petrol);color:var(--ink);overflow:hidden;
  }
  #map{position:absolute;inset:0;background:#dfe6ea;z-index:1}

  /* ---------- Top bar ---------- */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;
    background:linear-gradient(180deg,rgba(12,27,38,.96),rgba(12,27,38,.82) 70%,rgba(12,27,38,0));
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px;font-size:17px}
  .brand .glyph{
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:var(--amber);color:#241a00;font-size:17px;
    box-shadow:0 4px 14px rgba(245,165,36,.35)
  }
  .brand small{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.5px}
  .live{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    background:rgba(47,211,111,.12);border:1px solid rgba(47,211,111,.35);
    color:#9ff0bf;font-size:11px;font-weight:700;letter-spacing:.6px;
    padding:5px 10px;border-radius:999px
  }
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(47,211,111,.7);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,211,111,.55)}70%{box-shadow:0 0 0 9px rgba(47,211,111,0)}100%{box-shadow:0 0 0 0 rgba(47,211,111,0)}}
  .clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;font-weight:600}

  /* ---------- Role switch ---------- */
  .role{
    position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:1000;
    display:flex;background:rgba(12,27,38,.9);border:1px solid var(--line);
    border-radius:999px;padding:4px;backdrop-filter:blur(6px)
  }
  .role button{
    border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;
    padding:8px 15px;border-radius:999px;cursor:pointer;transition:.18s;letter-spacing:.2px
  }
  .role button.on{background:var(--amber);color:#241a00}

  /* ---------- Bottom sheet ---------- */
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:1000;
    background:var(--petrol);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    box-shadow:0 -18px 40px rgba(0,0,0,.4);
    max-height:52vh;display:flex;flex-direction:column;
  }
  @media(min-width:820px){
    .sheet{left:14px;bottom:14px;right:auto;width:370px;border-radius:18px;border:1px solid var(--line);max-height:calc(100vh - 90px)}
  }
  .handle{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin:9px auto 4px;cursor:pointer}
  .sheet-head{padding:4px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;cursor:pointer}
  .sheet-head .htext{flex:1;min-width:0}
  .sheet-head h2{margin:0;font-size:16px;letter-spacing:.2px}
  .sheet-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.35}
  .chev{flex:none;color:var(--muted);font-size:15px;background:var(--petrol-2);border:1px solid var(--line);
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;transition:.15s}
  .sheet.collapsed{max-height:none}
  .sheet.collapsed .sheet-body{display:none}
  .sheet.collapsed .sheet-head{border-bottom:0;padding-bottom:10px}
  .sheet.collapsed .sheet-head p{display:none}
  .sheet-body{padding:12px 14px 16px;overflow-y:auto}

  /* small action buttons inside passenger cards */
  .mini{border:1px solid var(--line);background:var(--petrol-2);color:var(--ink);font-weight:700;
    font-size:11.5px;padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s}
  .mini:hover{border-color:rgba(255,255,255,.3)}
  .mini.go{background:var(--emerald);color:#06231a;border-color:transparent}
  .mini.drop{background:var(--amber);color:#241a00;border-color:transparent}
  .grouplabel{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-weight:800;
    letter-spacing:.6px;margin:14px 2px 8px;text-transform:uppercase}
  .grouplabel .count{background:var(--petrol-2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--ink)}
  .chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border-radius:6px;
    border:2px solid #4a5b66;background:var(--petrol);cursor:pointer;position:relative;transition:.15s}
  .chk:checked{background:var(--emerald);border-color:var(--emerald)}
  .chk:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#06231a;font-size:13px;font-weight:900}
  .btn.drop{background:var(--amber);color:#241a00;border-color:transparent}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  /* admin reports */
  .rep{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--petrol-2);
    border:1px solid var(--line);margin-bottom:8px;align-items:center}
  .rep .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;font-weight:700;flex:none;width:44px;text-align:center;line-height:1.4}
  .filters{display:flex;gap:8px;margin-bottom:12px}
  .filters .chip{flex:1;border:1px solid var(--line);background:var(--petrol-2);color:var(--muted);
    font-weight:700;font-size:12.5px;padding:9px 8px;border-radius:10px;cursor:pointer;transition:.15s}
  .filters .chip.on{background:var(--amber);color:#241a00;border-color:transparent}
  .rep .who{flex:1;min-width:0}
  .rep .who .t{font-weight:700;font-size:13px}
  .rep .who .s{color:var(--muted);font-size:11.5px;margin-top:1px}
  .rep .dest{flex:none;font-size:11.5px;font-weight:800;color:#9fc6ff;background:rgba(123,156,240,.12);
    border:1px solid rgba(123,156,240,.3);padding:3px 9px;border-radius:99px}
  .stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .stat .box{flex:1;min-width:90px;background:var(--petrol-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat .box .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat .box .l{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.3px;margin-top:2px}

  .actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .btn{
    flex:1;min-width:130px;border:1px solid var(--line);background:var(--petrol-2);
    color:var(--ink);font-weight:700;font-size:13px;padding:11px 12px;border-radius:12px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s
  }
  .btn:hover{border-color:rgba(255,255,255,.28)}
  .btn.primary{background:var(--amber);color:#241a00;border-color:transparent}
  .btn.primary.armed{background:#ffd67a;animation:blink 1.1s infinite}
  @keyframes blink{50%{filter:brightness(1.08)}}
  .btn.ghost{background:transparent}

  /* list cards */
  .card{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;
    background:var(--petrol-2);border:1px solid var(--line);margin-bottom:9px;cursor:pointer;transition:.15s
  }
  .card:hover{border-color:rgba(255,255,255,.24);transform:translateY(-1px)}
  .badge{
    width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
    font-size:19px;flex:none;color:#0b1620;font-weight:800
  }
  .card .meta{min-width:0;flex:1}
  .card .meta .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta .s{color:var(--muted);font-size:12px;margin-top:2px}
  .eta{text-align:right;flex:none}
  .eta .n{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .eta .u{color:var(--muted);font-size:10.5px;letter-spacing:.4px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    color:#9ff0bf;background:rgba(47,211,111,.12);border:1px solid rgba(47,211,111,.3);
    padding:2px 7px;border-radius:99px}
  .pill .d{width:6px;height:6px;border-radius:50%;background:var(--live)}

  /* register form */
  .form{display:none;gap:8px;flex-direction:column;background:var(--petrol-2);
    border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:12px}
  .form.show{display:flex}
  .form label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px;margin-bottom:-3px}
  .form input,.form select{
    background:var(--petrol);border:1px solid var(--line);color:var(--ink);
    padding:10px;border-radius:10px;font-size:13.5px;font-family:inherit;width:100%
  }
  .form input:focus,.form select:focus{outline:none;border-color:var(--amber)}

  .switchrow{display:flex;align-items:center;justify-content:space-between;
    background:var(--petrol-2);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:12px}
  .switchrow .l .t{font-weight:700;font-size:13px}
  .switchrow .l .s{color:var(--muted);font-size:11.5px;margin-top:2px}
  .toggle{width:46px;height:26px;border-radius:99px;background:#33454f;position:relative;cursor:pointer;flex:none;transition:.2s;border:0}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .toggle.on{background:var(--emerald)}
  .toggle.on::after{left:23px}

  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 8px;line-height:1.5}
  .hint{color:var(--muted);font-size:11.5px;margin:2px 0 10px;line-height:1.4}

  /* Leaflet marker skins */
  .bus-badge{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    background:var(--c,#F5A524);font-size:19px;
    box-shadow:0 3px 10px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.85);
    position:relative
  }
  .bus-badge::before{content:"";position:absolute;inset:-6px;border-radius:50%;
    border:2px solid var(--c,#F5A524);opacity:.55;animation:ring 1.8s infinite}
  @keyframes ring{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.3);opacity:0}}
  .wait-pin{width:34px;height:34px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);
    background:var(--teal);display:grid;place-items:center;
    box-shadow:0 3px 8px rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.85)}
  .wait-pin span{transform:rotate(-45deg);font-size:16px}
  .leaflet-popup-content-wrapper{background:var(--petrol);color:var(--ink);border-radius:12px}
  .leaflet-popup-tip{background:var(--petrol)}
  .leaflet-popup-content{margin:11px 13px;font-size:13px;line-height:1.5}
  .leaflet-popup-content b{color:var(--amber)}
  .leaflet-container{font-family:inherit}

  /* ---------- name modal + login ---------- */
  .modal{position:absolute;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;
    background:rgba(6,14,20,.6);backdrop-filter:blur(3px);padding:20px}
  .modal.show{display:flex}
  .modal-card{width:100%;max-width:340px;background:var(--petrol);border:1px solid var(--line);
    border-radius:18px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .modal-card h3{margin:0 0 4px;font-size:17px}
  .modal-card p{margin:0 0 14px;color:var(--muted);font-size:12.5px;line-height:1.4}
  .modal-card input{width:100%;background:var(--petrol-2);border:1px solid var(--line);color:var(--ink);
    padding:12px;border-radius:11px;font-size:14px;font-family:inherit}
  .modal-card input:focus{outline:none;border-color:var(--amber)}
  .modal-actions{display:flex;gap:8px;margin-top:14px}
  .lock{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;
    background:var(--petrol-2);border:1px solid var(--line);margin:0 auto 12px}
  .err{color:#ff9a8a;font-size:12px;margin-top:8px;min-height:14px;text-align:center}
  .logout{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:14px;text-decoration:none}
  .logout:hover{color:var(--amber)}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand"><span class="glyph">🚐</span><div>BusetaGo<br><small>RASTREO EN VIVO</small></div></div>
  <div class="live"><span class="dot"></span>EN VIVO</div>
</div>

<div class="role">
  <button id="roleClient" class="on">Cliente</button>
  <button id="roleDriver">Conductor</button>
  <button id="roleAdmin">Admin</button>
</div>

<div class="sheet">
  <div class="handle"></div>
  <div class="sheet-head" id="sheetHead">
    <div class="htext">
      <h2 id="sheetTitle">Busetas en vivo</h2>
      <p id="sheetSub">Mirá por dónde viene tu buseta y marcá dónde estás esperando.</p>
    </div>
    <div class="chev" id="chev">▾</div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="modal" id="nameModal">
  <div class="modal-card">
    <h3>¿Quién espera aquí?</h3>
    <p>Indicá tu nombre para que el conductor sepa a quién recoger.</p>
    <input id="pinName" placeholder="Ej: Ana Solís" autocomplete="off"/>
    <div class="modal-actions">
      <button class="btn ghost" id="pinCancel">Cancelar</button>
      <button class="btn primary" id="pinOk">Marcar mi punto</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   BusetaGo — rastreo de busetas en tiempo real (single-file app)
   - Rutas y busetas simuladas moviéndose sobre un mapa real (GAM, CR)
   - Cliente: marca puntos de espera y ve ETA por buseta
   - Conductor: se registra, elige buseta y puede compartir GPS real
   ============================================================ */

/* ===== Supabase (base de datos central) =====
   Pegá aquí los dos valores de tu proyecto (Project Settings → API).
   Si los dejás vacíos, la app usa memoria local del dispositivo como respaldo. */
const SUPABASE_URL      = 'https://vvohzbzsuikcbrmafmdi.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oJrl2k-ZQCu4jva2aA3B_w_0frGVzpX';
let sb = null;
try {
  if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) { sb = null; }

const map = L.map('map', { zoomControl:false }).setView([10.0790, -84.2180], 14);
L.control.zoom({ position:'topright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);

/* Coordenadas en el distrito de Sabanilla de Alajuela (rumbo al Poás). Sabanilla, Los Ángeles y centro son de OpenStreetMap; San Luis y El Cerro son aproximados — ajustar a los pines reales. */
const SAB=[10.0741,-84.2157], LA=[10.0864,-84.2210], SL=[10.0855,-84.2290], EC=[10.0925,-84.2085];
const PLACES=['Sabanilla','Los Ángeles','San Luis','El Cerro'];
const PLACE_COORD={ 'Sabanilla':SAB, 'Los Ángeles':LA, 'San Luis':SL, 'El Cerro':EC };

const ROUTES = {
  S_LA:{ name:'Sabanilla → Los Ángeles', color:'#F5A524', dest:'Los Ángeles', ret:'LA_S',
         path:[SAB,[10.0803,-84.2184],LA] },
  LA_S:{ name:'Los Ángeles → Sabanilla', color:'#F5A524', dest:'Sabanilla', ret:'S_LA',
         path:[LA,[10.0803,-84.2184],SAB] },
  S_SL:{ name:'Sabanilla → San Luis',    color:'#3B9E82', dest:'San Luis',  ret:'SL_S',
         path:[SAB,[10.0798,-84.2224],SL] },
  SL_S:{ name:'San Luis → Sabanilla',    color:'#3B9E82', dest:'Sabanilla', ret:'S_SL',
         path:[SL,[10.0798,-84.2224],SAB] },
  S_EC:{ name:'Sabanilla → El Cerro',    color:'#7B9CF0', dest:'El Cerro',  ret:'EC_S',
         path:[SAB,[10.0833,-84.2121],EC] },
  EC_S:{ name:'El Cerro → Sabanilla',    color:'#7B9CF0', dest:'Sabanilla', ret:'S_EC',
         path:[EC,[10.0833,-84.2121],SAB] },
};

// draw the three corridors once (outbound paths)
['S_LA','S_SL','S_EC'].forEach(k=>{
  L.polyline(ROUTES[k].path,{color:ROUTES[k].color,weight:4,opacity:.35}).addTo(map);
});

let seq = 0;
const buses = [];
function busIcon(color){
  return L.divIcon({className:'',html:`<div class="bus-badge" style="--c:${color}">🚐</div>`,
                    iconSize:[38,38],iconAnchor:[19,19]});
}
function makeBus(driver, plate, routeKey, p0){
  const b = { id:'b'+(++seq), driver, plate, routeKey,
              p:(p0??Math.random()*1.5),
              speed:0.06+Math.random()*0.02, gps:false, live:false, marker:null };
  b.marker = L.marker(posOf(b), { icon:busIcon(ROUTES[routeKey].color), zIndexOffset:500 }).addTo(map);
  b.marker.on('click',()=>focusBus(b));
  buses.push(b); return b;
}
// starting fleet — three registered drivers, one per corridor
makeBus('Marco Jiménez','SJB-472','S_LA',0.2);
makeBus('Silvia Rojas','CB-1180','S_SL',0.9);
makeBus('Diego Castro','HB-905','S_EC',1.4);

function posOf(b){
  const path = ROUTES[b.routeKey].path;
  let seg = Math.floor(b.p); let t = b.p-seg;
  if(seg>=path.length-1){seg=path.length-2;t=1;}
  const a=path[seg], c=path[seg+1];
  return [a[0]+(c[0]-a[0])*t, a[1]+(c[1]-a[1])*t];
}
function stepBus(b){
  if(b.gps || b.live) return;               // GPS propio o posición en vivo remota manda
  const path = ROUTES[b.routeKey].path;
  b.p += b.speed;
  if(b.p >= path.length-1){                 // llegó al destino → toma la ruta de regreso
    b.routeKey = ROUTES[b.routeKey].ret; b.p = 0;
    b.marker.setIcon(busIcon(ROUTES[b.routeKey].color));
  }
  b.marker.setLatLng(posOf(b));
}
function haversine(a,b){
  const R=6371,d=x=>x*Math.PI/180;
  const dLat=d(b[0]-a[0]),dLng=d(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(d(a[0]))*Math.cos(d(b[0]))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
const AVG_KMH=24;
function etaMin(from,to){ return Math.max(1,Math.round(haversine(from,to)/AVG_KMH*60)); }

/* -------- geocodificación inversa (coordenadas → dirección) -------- */
function coordStr(lat,lng){ return `${(+lat).toFixed(5)}, ${(+lng).toFixed(5)}`; }
async function reverseGeocode(lat,lng){
  try{
    const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=17&addressdetails=1&accept-language=es`;
    const r=await fetch(url);
    const j=await r.json();
    const a=j.address||{};
    const parts=[ a.road||a.pedestrian||a.neighbourhood,
                  a.suburb||a.village||a.hamlet||a.town,
                  a.city||a.county ].filter(Boolean);
    return parts.slice(0,3).join(', ') || j.display_name || coordStr(lat,lng);
  }catch(e){ return coordStr(lat,lng); }  // si falla (sin red o bloqueado), deja las coordenadas
}

/* -------- pasajeros esperando (compartidos entre dispositivos vía Supabase) -------- */
let pins = [];                  // cache de {id, name, lat, lng, status, pickupAddr, marker}
let placing = false;
const pinMarkers = new Map();   // id -> marker
function pinIcon(status){
  const c = status==='onboard' ? 'var(--emerald)' : 'var(--teal)';
  const em = status==='onboard' ? '🧒' : '🙋';
  return L.divIcon({className:'',html:`<div class="wait-pin" style="background:${c}"><span>${em}</span></div>`,
                    iconSize:[34,34],iconAnchor:[6,32]});
}
// dibuja/actualiza/borra los marcadores según el arreglo pins
function renderPins(){
  const ids=new Set(pins.map(p=>String(p.id)));
  pins.forEach(p=>{
    let m=pinMarkers.get(String(p.id));
    if(!m){ m=L.marker([p.lat,p.lng],{icon:pinIcon(p.status)}).addTo(map); pinMarkers.set(String(p.id),m); }
    else { m.setLatLng([p.lat,p.lng]); m.setIcon(pinIcon(p.status)); }
    m.bindPopup(`<b>${p.name}</b><br>${p.status==='onboard'?'A bordo 🧒':'Esperando'}`);
    p.marker=m;
  });
  pinMarkers.forEach((m,id)=>{ if(!ids.has(id)){ map.removeLayer(m); pinMarkers.delete(id);} });
}
async function refreshPins(){
  if(!sb) return;
  const { data, error } = await sb.from('esperando').select('*')
    .in('status',['waiting','onboard']).order('created_at',{ascending:true});
  if(!error && data){
    pins = data.map(r=>({ id:r.id, name:r.name, lat:r.lat, lng:r.lng,
                          status:r.status, pickupAddr:r.pickup_addr }));
    renderPins();
  }
}
async function addPin(lat,lng,name){
  const nm = (name&&name.trim()) ? name.trim() : ('Pasajero '+(pins.length+1));
  if(sb){
    await sb.from('esperando').insert({ name:nm, lat, lng, status:'waiting' });
    await refreshPins();
  } else {
    pins.push({ id:'l'+Date.now(), name:nm, lat, lng, status:'waiting' }); renderPins();
  }
  render();
}
function pickUp(p){
  if(sb){
    sb.from('esperando').update({ status:'onboard' }).eq('id',p.id).then(()=>refreshPins());
    reverseGeocode(p.lat,p.lng).then(a=>{ sb.from('esperando').update({ pickup_addr:a }).eq('id',p.id).then(()=>refreshPins()); });
  } else {
    p.status='onboard'; p.pickupAddr=coordStr(p.lat,p.lng);
    reverseGeocode(p.lat,p.lng).then(a=>{ p.pickupAddr=a; render(); });
    renderPins();
  }
  render();
}

/* -------- reports (historial de entregas) -------- */
/* Con Supabase configurado, se guardan en la nube (central, todos los conductores → admin).
   Sin Supabase, respaldo en este dispositivo (localStorage). */
const REPORTS_KEY='busetago_reports';
function loadReports(){
  try{ const raw=localStorage.getItem(REPORTS_KEY);
       if(raw){ const arr=JSON.parse(raw); if(Array.isArray(arr)) return arr; } }catch(e){}
  return [];
}
function saveReports(){ try{ localStorage.setItem(REPORTS_KEY, JSON.stringify(reports)); }catch(e){} }

let reports = [];               // {t, passenger, pickupAddr, dropAddr, dropCoords, driver, plate}
const selected = new Set();

const rowToRep = d => ({ t:d.created_at, passenger:d.passenger, pickupAddr:d.pickup_addr,
  dropAddr:d.drop_addr, dropCoords:d.drop_coords, driver:d.driver, plate:d.plate });
const repToRow = r => ({ created_at:r.t, passenger:r.passenger, pickup_addr:r.pickupAddr,
  drop_addr:r.dropAddr, drop_coords:r.dropCoords, driver:r.driver, plate:r.plate });

async function refreshFromCloud(){
  if(!sb) return;
  const { data, error } = await sb.from('entregas').select('*').order('created_at',{ascending:true});
  if(!error && data){ reports = data.map(rowToRep); }
}
async function persistReports(rows){
  if(sb){
    const { error } = await sb.from('entregas').insert(rows.map(repToRow));
    if(!error){ await refreshFromCloud(); } else { reports.push(...rows); }
  } else { reports.push(...rows); saveReports(); }
}

// Dejar pasajeros en la ubicación actual; UI inmediata, guardado en segundo plano
function dropPassengers(ids){
  const my = buses.find(b=>b.id===myBusId);
  const now = new Date();
  const dc = my ? my.marker.getLatLng() : null;
  const dropped = ids.map(id=>pins.find(x=>String(x.id)===String(id))).filter(p=>p&&p.status==='onboard');
  if(dropped.length===0) return;
  const dropIds = dropped.map(p=>p.id);
  // salida inmediata del mapa y de la lista
  dropped.forEach(p=>{ selected.delete(p.id); const m=pinMarkers.get(String(p.id)); if(m){map.removeLayer(m);pinMarkers.delete(String(p.id));} });
  pins = pins.filter(p=>!dropIds.some(id=>String(id)===String(p.id)));
  render();
  (async ()=>{
    const dropAddr = dc ? await reverseGeocode(dc.lat,dc.lng) : '—';
    const rows = dropped.map(p=>({ t:now.toISOString(), passenger:p.name,
      pickupAddr:p.pickupAddr||'—', dropAddr,
      dropCoords: dc?[dc.lat,dc.lng]:null, driver:my?my.driver:'—', plate:my?my.plate:'—' }));
    await persistReports(rows);
    if(sb){ await sb.from('esperando').delete().in('id', dropIds); await refreshPins(); }
    if(role==='admin') render();
  })();
}

/* -------- posiciones en vivo (GPS compartido entre dispositivos) -------- */
const livePos = new Map();       // plate -> {lat,lng,driver,route,ts}
const remoteMarkers = new Map(); // plate -> marker (busetas de otros dispositivos)
const LIVE_TTL = 30000;          // ms: una posición se considera "en vivo" si es reciente

function applyLivePositions(){
  const now=Date.now();
  // 1) busetas locales: si su placa está transmitiendo en vivo, seguimos esa posición
  buses.forEach(b=>{
    if(b.gps) return;                       // mi propio GPS ya manda
    const lp=livePos.get(b.plate);
    if(lp && now-lp.ts < LIVE_TTL){ b.live=true; b.marker.setLatLng([lp.lat,lp.lng]); }
    else b.live=false;
  });
  // 2) placas remotas que no están en la flota local → marcador propio
  const localPlates=new Set(buses.map(b=>b.plate));
  livePos.forEach((lp,plate)=>{
    if(localPlates.has(plate)) return;
    const fresh = now-lp.ts < LIVE_TTL;
    let m=remoteMarkers.get(plate);
    if(!fresh){ if(m){ map.removeLayer(m); remoteMarkers.delete(plate);} return; }
    if(!m){
      m=L.marker([lp.lat,lp.lng],{icon:busIcon('#0E9F6E'),zIndexOffset:600})
        .addTo(map).bindPopup(`<b>${lp.driver||'Buseta'}</b><br>${plate} · GPS en vivo`);
      remoteMarkers.set(plate,m);
    } else { m.setLatLng([lp.lat,lp.lng]); }
  });
  // 3) limpiar marcadores remotos que ya no están
  remoteMarkers.forEach((m,plate)=>{ if(!livePos.has(plate)){ map.removeLayer(m); remoteMarkers.delete(plate);} });
}

async function refreshPositions(){
  if(!sb) return;
  const { data, error } = await sb.from('posiciones').select('*');
  if(!error && data){
    livePos.clear();
    data.forEach(r=>livePos.set(r.plate,{lat:r.lat,lng:r.lng,driver:r.driver,route:r.route,ts:new Date(r.updated_at).getTime()}));
    applyLivePositions();
  }
}

let lastBroadcast=0;
async function broadcastPosition(b,lat,lng){
  if(!sb) return;
  const t=Date.now(); if(t-lastBroadcast<2000) return;  // como máximo cada 2s
  lastBroadcast=t;
  try{ await sb.from('posiciones').upsert(
    { plate:b.plate, driver:b.driver, route:b.routeKey, lat, lng, updated_at:new Date().toISOString() },
    { onConflict:'plate' }); }catch(e){}
}
async function stopBroadcast(b){
  if(!sb||!b) return;
  try{ await sb.from('posiciones').delete().eq('plate',b.plate); }catch(e){}
}

async function clearPins(){

function inFilter(r){

  if(adminFilter==='today') return d.toDateString()===now.toDateString();

  return true;
}

  $('#logoutA').onclick=e=>{e.preventDefault();adminAuth=false;render();};
}

function exportCsv(){
  const list=reports.filter(inFilter);
  const rows=[['Fecha','Hora','Pasajero','Dirección recogida','Dirección entrega','Coordenadas entrega','Conductor','Placa']];
  list.forEach(r=>{ const d=new Date(r.t); rows.push([
    d.toLocaleDateString('es-CR'), d.toLocaleTimeString('es-CR'),
    r.passenger, r.pickupAddr||'', r.dropAddr||'',
    r.dropCoords?r.dropCoords.join(' '):'', r.driver, r.plate ]); });
  const csv=rows.map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url;
  a.download=`reporte-busetago-${adminFilter}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function renderAdminLogin(body){
  $('#sheetTitle').textContent='Acceso administrador';
  $('#sheetSub').textContent='Ingresá la clave para ver los reportes.';
  body.innerHTML=`
    <div class="form show" style="align-items:stretch">
      <div class="lock">📊</div>
      <label>Clave de administrador</label>
      <input id="admKey" type="password" placeholder="••••••••" autocomplete="off"/>
      <button class="btn primary" id="admEnter" style="margin-top:4px">Ingresar</button>
      <div class="err" id="admErr"></div>
    </div>`;
  const go=()=>{
    if($('#admKey').value===ADMIN_KEY){ adminAuth=true; render(); }
    else { $('#admErr').textContent='Clave incorrecta. Intentá de nuevo.'; $('#admKey').value=''; $('#admKey').focus(); }
  };
  $('#admEnter').onclick=go;
  $('#admKey').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  setTimeout(()=>$('#admKey').focus(),50);
}

let watchId=null;
function toggleGps(b){
  if(!b) return;
  if(b.gps){ b.gps=false; if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;} stopBroadcast(b); render(); return; }
  if(!navigator.geolocation){ alert('Sin soporte de GPS en este navegador.'); return; }
  let firstFix=true;
  watchId=navigator.geolocation.watchPosition(
    p=>{ b.gps=true; const lat=p.coords.latitude, lng=p.coords.longitude;
         b.marker.setLatLng([lat,lng]);
         if(firstFix){ map.flyTo([lat,lng],15); firstFix=false; }
         broadcastPosition(b,lat,lng);       // ← comparte la ubicación con los demás dispositivos
         render(); },
    ()=>{ alert('No se pudo activar el GPS (permiso denegado). Se mantiene la posición simulada.'); },
    { enableHighAccuracy:true, maximumAge:2000 }
  );
}

/* clock + animation loop */
function tick(){
  buses.forEach(stepBus);
  if(sb) applyLivePositions();              // mantiene el movimiento en vivo y limpia posiciones viejas
  const modalOpen=document.getElementById('nameModal').classList.contains('show');
  if(modalOpen) return;
  if(role==='cliente'){ render(); }
  else if(role==='conductor' && driverAuth && !showForm){ render(); }   // live ETAs, but not while typing
  else if(role==='admin' && adminAuth){ render(); }                     // live report list
}
setInterval(tick,1000);
function clock(){ const d=new Date();
  document.title='BusetaGo · '+d.toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'}); }
setInterval(clock,1000); clock();

/* arranque de datos: nube (Supabase) o respaldo local */
async function initData(){
  if(sb){
    await refreshFromCloud();
    await refreshPositions();
    await refreshPins();
    try{
      sb.channel('busetago-rt')
        .on('postgres_changes',{event:'*',schema:'public',table:'entregas'},
          ()=>{ refreshFromCloud().then(()=>{ if(role==='admin') render(); }); })
        .on('postgres_changes',{event:'*',schema:'public',table:'posiciones'},
          ()=>{ refreshPositions(); })
        .on('postgres_changes',{event:'*',schema:'public',table:'esperando'},
          ()=>{ refreshPins().then(()=>render()); })
        .subscribe();
    }catch(e){}
  } else {
    reports = loadReports();
  }
  render();
}
initData();
</script>
