<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>BusetaGo · Rastreo en tiempo real</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --petrol:#0C1B26;
    --petrol-2:#12303f;
    --ink:#E7EEF2;
    --muted:#8CA0AD;
    --line:rgba(255,255,255,.10);
    --amber:#F5A524;
    --emerald:#0E9F6E;
    --teal:#3B9E82;
    --iris:#7B9CF0;
    --live:#2fd36f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--petrol);color:var(--ink);overflow:hidden;
  }
  #map{position:absolute;inset:0;background:#dfe6ea;z-index:1}

  /* ---------- Top bar ---------- */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;align-items:center;gap:12px;
    padding:10px 14px;
    background:linear-gradient(180deg,rgba(12,27,38,.96),rgba(12,27,38,.82) 70%,rgba(12,27,38,0));
    pointer-events:none;
  }
  .topbar > *{pointer-events:auto}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px;font-size:17px}
  .brand .glyph{
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:var(--amber);color:#241a00;font-size:17px;
    box-shadow:0 4px 14px rgba(245,165,36,.35)
  }
  .brand small{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.5px}
  .live{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    background:rgba(47,211,111,.12);border:1px solid rgba(47,211,111,.35);
    color:#9ff0bf;font-size:11px;font-weight:700;letter-spacing:.6px;
    padding:5px 10px;border-radius:999px
  }
  .live .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(47,211,111,.7);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,211,111,.55)}70%{box-shadow:0 0 0 9px rgba(47,211,111,0)}100%{box-shadow:0 0 0 0 rgba(47,211,111,0)}}
  .clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;font-weight:600}

  /* ---------- Role switch ---------- */
  .role{
    position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:1000;
    display:flex;background:rgba(12,27,38,.9);border:1px solid var(--line);
    border-radius:999px;padding:4px;backdrop-filter:blur(6px)
  }
  .role button{
    border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;
    padding:8px 15px;border-radius:999px;cursor:pointer;transition:.18s;letter-spacing:.2px
  }
  .role button.on{background:var(--amber);color:#241a00}

  /* ---------- Bottom sheet ---------- */
  .sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:1000;
    background:var(--petrol);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;
    box-shadow:0 -18px 40px rgba(0,0,0,.4);
    max-height:52vh;display:flex;flex-direction:column;
  }
  @media(min-width:820px){
    .sheet{left:14px;bottom:14px;right:auto;width:370px;border-radius:18px;border:1px solid var(--line);max-height:calc(100vh - 90px)}
  }
  .handle{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.22);margin:9px auto 4px;cursor:pointer}
  .sheet-head{padding:4px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px;cursor:pointer}
  .sheet-head .htext{flex:1;min-width:0}
  .sheet-head h2{margin:0;font-size:16px;letter-spacing:.2px}
  .sheet-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.35}
  .chev{flex:none;color:var(--muted);font-size:15px;background:var(--petrol-2);border:1px solid var(--line);
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;transition:.15s}
  .sheet.collapsed{max-height:none}
  .sheet.collapsed .sheet-body{display:none}
  .sheet.collapsed .sheet-head{border-bottom:0;padding-bottom:10px}
  .sheet.collapsed .sheet-head p{display:none}
  .sheet-body{padding:12px 14px 16px;overflow-y:auto}

  /* small action buttons inside passenger cards */
  .mini{border:1px solid var(--line);background:var(--petrol-2);color:var(--ink);font-weight:700;
    font-size:11.5px;padding:7px 11px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s}
  .mini:hover{border-color:rgba(255,255,255,.3)}
  .mini.go{background:var(--emerald);color:#06231a;border-color:transparent}
  .mini.drop{background:var(--amber);color:#241a00;border-color:transparent}
  .grouplabel{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-weight:800;
    letter-spacing:.6px;margin:14px 2px 8px;text-transform:uppercase}
  .grouplabel .count{background:var(--petrol-2);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--ink)}
  .chk{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;border-radius:6px;
    border:2px solid #4a5b66;background:var(--petrol);cursor:pointer;position:relative;transition:.15s}
  .chk:checked{background:var(--emerald);border-color:var(--emerald)}
  .chk:checked::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#06231a;font-size:13px;font-weight:900}
  .btn.drop{background:var(--amber);color:#241a00;border-color:transparent}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  /* admin reports */
  .rep{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--petrol-2);
    border:1px solid var(--line);margin-bottom:8px;align-items:center}
  .rep .time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;font-weight:700;flex:none;width:52px}
  .rep .who{flex:1;min-width:0}
  .rep .who .t{font-weight:700;font-size:13px}
  .rep .who .s{color:var(--muted);font-size:11.5px;margin-top:1px}
  .rep .dest{flex:none;font-size:11.5px;font-weight:800;color:#9fc6ff;background:rgba(123,156,240,.12);
    border:1px solid rgba(123,156,240,.3);padding:3px 9px;border-radius:99px}
  .stat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .stat .box{flex:1;min-width:90px;background:var(--petrol-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .stat .box .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
  .stat .box .l{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.3px;margin-top:2px}

  .actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .btn{
    flex:1;min-width:130px;border:1px solid var(--line);background:var(--petrol-2);
    color:var(--ink);font-weight:700;font-size:13px;padding:11px 12px;border-radius:12px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s
  }
  .btn:hover{border-color:rgba(255,255,255,.28)}
  .btn.primary{background:var(--amber);color:#241a00;border-color:transparent}
  .btn.primary.armed{background:#ffd67a;animation:blink 1.1s infinite}
  @keyframes blink{50%{filter:brightness(1.08)}}
  .btn.ghost{background:transparent}

  /* list cards */
  .card{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:13px;
    background:var(--petrol-2);border:1px solid var(--line);margin-bottom:9px;cursor:pointer;transition:.15s
  }
  .card:hover{border-color:rgba(255,255,255,.24);transform:translateY(-1px)}
  .badge{
    width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
    font-size:19px;flex:none;color:#0b1620;font-weight:800
  }
  .card .meta{min-width:0;flex:1}
  .card .meta .t{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta .s{color:var(--muted);font-size:12px;margin-top:2px}
  .eta{text-align:right;flex:none}
  .eta .n{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
  .eta .u{color:var(--muted);font-size:10.5px;letter-spacing:.4px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
    color:#9ff0bf;background:rgba(47,211,111,.12);border:1px solid rgba(47,211,111,.3);
    padding:2px 7px;border-radius:99px}
  .pill .d{width:6px;height:6px;border-radius:50%;background:var(--live)}

  /* register form */
  .form{display:none;gap:8px;flex-direction:column;background:var(--petrol-2);
    border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:12px}
  .form.show{display:flex}
  .form label{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px;margin-bottom:-3px}
  .form input,.form select{
    background:var(--petrol);border:1px solid var(--line);color:var(--ink);
    padding:10px;border-radius:10px;font-size:13.5px;font-family:inherit;width:100%
  }
  .form input:focus,.form select:focus{outline:none;border-color:var(--amber)}

  .switchrow{display:flex;align-items:center;justify-content:space-between;
    background:var(--petrol-2);border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:12px}
  .switchrow .l .t{font-weight:700;font-size:13px}
  .switchrow .l .s{color:var(--muted);font-size:11.5px;margin-top:2px}
  .toggle{width:46px;height:26px;border-radius:99px;background:#33454f;position:relative;cursor:pointer;flex:none;transition:.2s;border:0}
  .toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
  .toggle.on{background:var(--emerald)}
  .toggle.on::after{left:23px}

  .empty{color:var(--muted);font-size:12.5px;text-align:center;padding:14px 8px;line-height:1.5}
  .hint{color:var(--muted);font-size:11.5px;margin:2px 0 10px;line-height:1.4}

  /* Leaflet marker skins */
  .bus-badge{
    width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    background:var(--c,#F5A524);font-size:19px;
    box-shadow:0 3px 10px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.85);
    position:relative
  }
  .bus-badge::before{content:"";position:absolute;inset:-6px;border-radius:50%;
    border:2px solid var(--c,#F5A524);opacity:.55;animation:ring 1.8s infinite}
  @keyframes ring{0%{transform:scale(.7);opacity:.6}100%{transform:scale(1.3);opacity:0}}
  .wait-pin{width:34px;height:34px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);
    background:var(--teal);display:grid;place-items:center;
    box-shadow:0 3px 8px rgba(0,0,0,.4),0 0 0 3px rgba(255,255,255,.85)}
  .wait-pin span{transform:rotate(-45deg);font-size:16px}
  .leaflet-popup-content-wrapper{background:var(--petrol);color:var(--ink);border-radius:12px}
  .leaflet-popup-tip{background:var(--petrol)}
  .leaflet-popup-content{margin:11px 13px;font-size:13px;line-height:1.5}
  .leaflet-popup-content b{color:var(--amber)}
  .leaflet-container{font-family:inherit}

  /* ---------- name modal + login ---------- */
  .modal{position:absolute;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;
    background:rgba(6,14,20,.6);backdrop-filter:blur(3px);padding:20px}
  .modal.show{display:flex}
  .modal-card{width:100%;max-width:340px;background:var(--petrol);border:1px solid var(--line);
    border-radius:18px;padding:20px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .modal-card h3{margin:0 0 4px;font-size:17px}
  .modal-card p{margin:0 0 14px;color:var(--muted);font-size:12.5px;line-height:1.4}
  .modal-card input{width:100%;background:var(--petrol-2);border:1px solid var(--line);color:var(--ink);
    padding:12px;border-radius:11px;font-size:14px;font-family:inherit}
  .modal-card input:focus{outline:none;border-color:var(--amber)}
  .modal-actions{display:flex;gap:8px;margin-top:14px}
  .lock{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:24px;
    background:var(--petrol-2);border:1px solid var(--line);margin:0 auto 12px}
  .err{color:#ff9a8a;font-size:12px;margin-top:8px;min-height:14px;text-align:center}
  .logout{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:14px;text-decoration:none}
  .logout:hover{color:var(--amber)}
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand"><span class="glyph">🚐</span><div>BusetaGo<br><small>RASTREO EN VIVO</small></div></div>
  <div class="live"><span class="dot"></span>EN VIVO</div>
</div>

<div class="role">
  <button id="roleClient" class="on">Cliente</button>
  <button id="roleDriver">Conductor</button>
  <button id="roleAdmin">Admin</button>
</div>

<div class="sheet">
  <div class="handle"></div>
  <div class="sheet-head" id="sheetHead">
    <div class="htext">
      <h2 id="sheetTitle">Busetas en vivo</h2>
      <p id="sheetSub">Mirá por dónde viene tu buseta y marcá dónde estás esperando.</p>
    </div>
    <div class="chev" id="chev">▾</div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="modal" id="nameModal">
  <div class="modal-card">
    <h3>¿Quién espera aquí?</h3>
    <p>Indicá tu nombre para que el conductor sepa a quién recoger.</p>
    <input id="pinName" placeholder="Ej: Ana Solís" autocomplete="off"/>
    <div class="modal-actions">
      <button class="btn ghost" id="pinCancel">Cancelar</button>
      <button class="btn primary" id="pinOk">Marcar mi punto</button>
    </div>
  </div>
</div>

<div class="modal" id="destModal">
  <div class="modal-card">
    <h3>¿Dónde los dejaste?</h3>
    <p id="destSub">Elegí el destino para guardarlo en el reporte.</p>
    <div id="destBtns" style="display:flex;flex-direction:column;gap:8px;margin-top:6px"></div>
    <div class="modal-actions"><button class="btn ghost" id="destCancel">Cancelar</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* ============================================================
   BusetaGo — rastreo de busetas en tiempo real (single-file app)
   - Rutas y busetas simuladas moviéndose sobre un mapa real (GAM, CR)
   - Cliente: marca puntos de espera y ve ETA por buseta
   - Conductor: se registra, elige buseta y puede compartir GPS real
   ============================================================ */

const map = L.map('map', { zoomControl:false }).setView([10.0790, -84.2180], 14);
L.control.zoom({ position:'topright' }).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);

/* Coordenadas en el distrito de Sabanilla de Alajuela (rumbo al Poás). Sabanilla, Los Ángeles y centro son de OpenStreetMap; San Luis y El Cerro son aproximados — ajustar a los pines reales. */
const SAB=[10.0741,-84.2157], LA=[10.0864,-84.2210], SL=[10.0855,-84.2290], EC=[10.0925,-84.2085];
const PLACES=['Sabanilla','Los Ángeles','San Luis','El Cerro'];
const PLACE_COORD={ 'Sabanilla':SAB, 'Los Ángeles':LA, 'San Luis':SL, 'El Cerro':EC };

const ROUTES = {
  S_LA:{ name:'Sabanilla → Los Ángeles', color:'#F5A524', dest:'Los Ángeles', ret:'LA_S',
         path:[SAB,[10.0803,-84.2184],LA] },
  LA_S:{ name:'Los Ángeles → Sabanilla', color:'#F5A524', dest:'Sabanilla', ret:'S_LA',
         path:[LA,[10.0803,-84.2184],SAB] },
  S_SL:{ name:'Sabanilla → San Luis',    color:'#3B9E82', dest:'San Luis',  ret:'SL_S',
         path:[SAB,[10.0798,-84.2224],SL] },
  SL_S:{ name:'San Luis → Sabanilla',    color:'#3B9E82', dest:'Sabanilla', ret:'S_SL',
         path:[SL,[10.0798,-84.2224],SAB] },
  S_EC:{ name:'Sabanilla → El Cerro',    color:'#7B9CF0', dest:'El Cerro',  ret:'EC_S',
         path:[SAB,[10.0833,-84.2121],EC] },
  EC_S:{ name:'El Cerro → Sabanilla',    color:'#7B9CF0', dest:'Sabanilla', ret:'S_EC',
         path:[EC,[10.0833,-84.2121],SAB] },
};

// draw the three corridors once (outbound paths)
['S_LA','S_SL','S_EC'].forEach(k=>{
  L.polyline(ROUTES[k].path,{color:ROUTES[k].color,weight:4,opacity:.35}).addTo(map);
});

let seq = 0;
const buses = [];
function makeBus(driver, plate, routeKey, p0){
  const b = { id:'b'+(++seq), driver, plate, routeKey,
              p:(p0??Math.random()*1.5),
              speed:0.06+Math.random()*0.02, gps:false, marker:null };
  const c = ROUTES[routeKey].color;
  b.marker = L.marker(posOf(b), {
    icon:L.divIcon({className:'',html:`<div class="bus-badge" style="--c:${c}">🚐</div>`,
                    iconSize:[38,38],iconAnchor:[19,19]}), zIndexOffset:500
  }).addTo(map);
  b.marker.on('click',()=>focusBus(b));
  buses.push(b); return b;
}
// starting fleet — three registered drivers, one per corridor
makeBus('Marco Jiménez','SJB-472','S_LA',0.2);
makeBus('Silvia Rojas','CB-1180','S_SL',0.9);
makeBus('Diego Castro','HB-905','S_EC',1.4);

function posOf(b){
  const path = ROUTES[b.routeKey].path;
  let seg = Math.floor(b.p); let t = b.p-seg;
  if(seg>=path.length-1){seg=path.length-2;t=1;}
  const a=path[seg], c=path[seg+1];
  return [a[0]+(c[0]-a[0])*t, a[1]+(c[1]-a[1])*t];
}
function stepBus(b){
  if(b.gps) return;
  const path = ROUTES[b.routeKey].path;
  b.p += b.speed;
  if(b.p >= path.length-1){                 // llegó al destino → toma la ruta de regreso
    b.routeKey = ROUTES[b.routeKey].ret; b.p = 0;
    const c=ROUTES[b.routeKey].color;
    b.marker.setIcon(L.divIcon({className:'',html:`<div class="bus-badge" style="--c:${c}">🚐</div>`,
                    iconSize:[38,38],iconAnchor:[19,19]}));
  }
  b.marker.setLatLng(posOf(b));
}
function haversine(a,b){
  const R=6371,d=x=>x*Math.PI/180;
  const dLat=d(b[0]-a[0]),dLng=d(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(d(a[0]))*Math.cos(d(b[0]))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
const AVG_KMH=24;
function etaMin(from,to){ return Math.max(1,Math.round(haversine(from,to)/AVG_KMH*60)); }

/* -------- geocodificación inversa (coordenadas → dirección) -------- */
function coordStr(lat,lng){ return `${(+lat).toFixed(5)}, ${(+lng).toFixed(5)}`; }
async function reverseGeocode(lat,lng){
  try{
    const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=17&addressdetails=1&accept-language=es`;
    const r=await fetch(url);
    const j=await r.json();
    const a=j.address||{};
    const parts=[ a.road||a.pedestrian||a.neighbourhood,
                  a.suburb||a.village||a.hamlet||a.town,
                  a.city||a.county ].filter(Boolean);
    return parts.slice(0,3).join(', ') || j.display_name || coordStr(lat,lng);
  }catch(e){ return coordStr(lat,lng); }  // si falla (sin red o bloqueado), deja las coordenadas
}

/* -------- waiting pins (clientes esperando) -------- */
const pins = [];
let placing = false;
function pinIcon(status){
  const c = status==='onboard' ? 'var(--emerald)' : 'var(--teal)';
  const em = status==='onboard' ? '🧒' : '🙋';
  return L.divIcon({className:'',html:`<div class="wait-pin" style="background:${c}"><span>${em}</span></div>`,
                    iconSize:[34,34],iconAnchor:[6,32]});
}
function addPin(lat,lng,name){
  const nm = (name&&name.trim()) ? name.trim() : ('Pasajero '+(pins.length+1));
  const p={ id:pins.length+1, lat, lng, name:nm, status:'waiting', marker:null };
  p.marker = L.marker([lat,lng],{ icon:pinIcon('waiting') })
    .addTo(map).bindPopup(`<b>${nm}</b><br>Esperando`);
  pins.push(p); render();
}
function pickUp(p){
  p.status='onboard'; p.marker.setIcon(pinIcon('onboard'));
  p.marker.setPopupContent(`<b>${p.name}</b><br>A bordo 🧒`);
  p.pickupTime=new Date();
  p.pickupCoords=[p.lat,p.lng];
  p.pickupAddr=coordStr(p.lat,p.lng);          // provisional hasta que resuelva la dirección
  reverseGeocode(p.lat,p.lng).then(a=>{ p.pickupAddr=a;
    if(role==='conductor') render(); });
  render();
}

/* -------- reports (historial de entregas) -------- */
const reports = [];        // {time, passenger, destination, plate, driver, pickupAddr, dropAddr, dropCoords}
const selected = new Set(); // ids of onboard passengers selected to drop together

// open the destination picker for a set of onboard passenger ids
let pendingDrop=[];
function openDropModal(ids){
  pendingDrop = ids.filter(id=>{ const p=pins.find(x=>x.id==id); return p&&p.status==='onboard'; });
  if(pendingDrop.length===0) return;
  document.getElementById('destSub').textContent =
    `Vas a dejar ${pendingDrop.length} pasajero(s) donde estás ahora. Elegí el destino para el reporte.`;
  const box=document.getElementById('destBtns'); box.innerHTML='';
  PLACES.forEach(place=>{
    const btn=document.createElement('button');
    btn.className='btn primary'; btn.textContent='📍 '+place;
    btn.onclick=()=>confirmDrop(place);
    box.appendChild(btn);
  });
  document.getElementById('destModal').classList.add('show');
}
function confirmDrop(place){
  const my = buses.find(b=>b.id===myBusId);
  const now = new Date();
  const dc = my ? my.marker.getLatLng() : null;   // ubicación actual de la buseta = dónde se deja
  pendingDrop.forEach(id=>{
    const p=pins.find(x=>x.id==id); if(!p||p.status!=='onboard') return;
    const rep={ time:now, passenger:p.name, destination:place,
                plate:my?my.plate:'—', driver:my?my.driver:'—',
                pickupAddr:p.pickupAddr||'—',
                dropCoords: dc?[dc.lat,dc.lng]:null,
                dropAddr: dc?coordStr(dc.lat,dc.lng):'—' };
    reports.push(rep);
    if(dc) reverseGeocode(dc.lat,dc.lng).then(a=>{ rep.dropAddr=a; if(role==='admin') render(); });
    p.status='done'; map.removeLayer(p.marker); selected.delete(p.id);
  });
  pendingDrop=[];
  document.getElementById('destModal').classList.remove('show');
  render();
}
document.getElementById('destCancel').onclick=()=>{
  document.getElementById('destModal').classList.remove('show'); pendingDrop=[];
};

/* ask for the passenger name before dropping the pin */
let pendingLoc=null;
function askName(lat,lng){
  pendingLoc={lat,lng};
  const inp=document.getElementById('pinName');
  inp.value=''; document.getElementById('nameModal').classList.add('show');
  setTimeout(()=>inp.focus(),50);
}
function confirmPin(){
  if(!pendingLoc) return;
  addPin(pendingLoc.lat,pendingLoc.lng,document.getElementById('pinName').value);
  document.getElementById('nameModal').classList.remove('show'); pendingLoc=null;
}
document.getElementById('pinOk').onclick=confirmPin;
document.getElementById('pinCancel').onclick=()=>{document.getElementById('nameModal').classList.remove('show');pendingLoc=null;};
document.getElementById('pinName').addEventListener('keydown',e=>{if(e.key==='Enter')confirmPin();});

map.on('click',e=>{
  if(placing){ askName(e.latlng.lat,e.latlng.lng); }
});
function clearPins(){ pins.forEach(p=>map.removeLayer(p.marker)); pins.length=0; render(); }

function focusBus(b){ map.flyTo(b.marker.getLatLng(),15,{duration:.6});
  b.marker.bindPopup(`<b>${b.driver}</b><br>${b.plate} · ${ROUTES[b.routeKey].name.split('·')[0].trim()}`).openPopup(); }

/* ---------------- UI state ---------------- */
let role='cliente';
let myBusId=null;      // conductor's selected bus
let showForm=false;
const DRIVER_KEY='buseta2026';   // clave de acceso de conductores
const ADMIN_KEY='admin2026';     // clave de acceso de administrador
let driverAuth=false;
let adminAuth=false;

const $ = s=>document.querySelector(s);
$('#roleClient').onclick=()=>setRole('cliente');
$('#roleDriver').onclick=()=>setRole('conductor');
$('#roleAdmin').onclick=()=>setRole('admin');
function setRole(r){
  role=r; placing=false;
  $('#roleClient').classList.toggle('on',r==='cliente');
  $('#roleDriver').classList.toggle('on',r==='conductor');
  $('#roleAdmin').classList.toggle('on',r==='admin');
  render();
}

function render(){
  const body=$('#sheetBody');
  const sc=body.scrollTop;
  if(role==='cliente') renderClient(body);
  else if(role==='conductor') renderDriver(body);
  else renderAdmin(body);
  body.scrollTop=sc;
}

/* collapse / expand the bottom sheet to free up the map on mobile */
let collapsed=false;
function toggleCollapse(){
  collapsed=!collapsed;
  document.querySelector('.sheet').classList.toggle('collapsed',collapsed);
  document.getElementById('chev').textContent = collapsed ? '▴' : '▾';
  setTimeout(()=>map.invalidateSize(),260);
}
document.getElementById('sheetHead').addEventListener('click',toggleCollapse);
document.querySelector('.handle').addEventListener('click',e=>{e.stopPropagation();toggleCollapse();});

function renderClient(body){
  $('#sheetTitle').textContent='Busetas en vivo';
  $('#sheetSub').textContent='Mirá por dónde viene tu buseta y marcá dónde estás esperando.';
  const active = pins.filter(p=>p.status!=='done');
  const ref = active.length ? [active[active.length-1].lat,active[active.length-1].lng] : null;

  let html = `<div class="actions">
    <button class="btn primary ${placing?'armed':''}" id="place">${placing?'Tocá el mapa 👆':'📍 Marcar dónde espero'}</button>
    <button class="btn ghost" id="geo">🛰️ Usar mi ubicación</button>
  </div>`;
  html += active.length
    ? `<div class="hint">${active.length} punto(s) de espera activo(s). El ETA se calcula al más reciente. <a href="#" id="clr" style="color:var(--amber)">Limpiar</a></div>`
    : `<div class="hint">Aún no marcás dónde esperás. Los tiempos abajo son estimados a tu punto una vez marcado.</div>`;

  buses.forEach(b=>{
    const c=ROUTES[b.routeKey].color;
    const eta = ref ? etaMin(b.marker.getLatLng(),ref) : null;
    html += `<div class="card" data-focus="${b.id}">
      <div class="badge" style="background:${c}">🚐</div>
      <div class="meta">
        <div class="t">${ROUTES[b.routeKey].name.split('·')[0].trim()}</div>
        <div class="s">${b.driver} · ${b.plate} <span class="pill" style="margin-left:4px"><span class="d"></span>${b.gps?'GPS':'EN VIVO'}</span></div>
      </div>
      <div class="eta">${eta?`<div class="n">${eta}</div><div class="u">MIN</div>`:`<div class="u" style="font-size:11px">EN<br>RUTA</div>`}</div>
    </div>`;
  });
  body.innerHTML=html;

  $('#place').onclick=()=>{ placing=!placing; render(); };
  $('#geo').onclick=useMyLocation;
  if($('#clr')) $('#clr').onclick=e=>{e.preventDefault();clearPins();};
  body.querySelectorAll('[data-focus]').forEach(el=>el.onclick=()=>{
    focusBus(buses.find(b=>b.id===el.dataset.focus));
  });
}

function useMyLocation(){
  if(!navigator.geolocation){ alert('Tu navegador no soporta geolocalización.'); return; }
  navigator.geolocation.getCurrentPosition(
    p=>{ map.flyTo([p.coords.latitude,p.coords.longitude],15); askName(p.coords.latitude,p.coords.longitude); },
    ()=>alert('No pudimos obtener tu ubicación (permiso denegado o no disponible).')
  );
}

function renderDriver(body){
  if(!driverAuth){ renderDriverLogin(body); return; }
  $('#sheetTitle').textContent='Modo conductor';
  $('#sheetSub').textContent='Registrate, elegí tu buseta y compartí tu ubicación con los pasajeros.';
  const my = buses.find(b=>b.id===myBusId);

  let html = `<div class="actions">
    <button class="btn ${showForm?'ghost':'primary'}" id="toggleForm">${showForm?'Cerrar':'➕ Registrar conductor'}</button>
  </div>`;

  html += `<div class="form ${showForm?'show':''}" id="regForm">
    <label>Nombre del conductor</label><input id="fName" placeholder="Ej: Laura Vargas"/>
    <label>Placa</label><input id="fPlate" placeholder="Ej: BUS-330"/>
    <label>Ruta</label>
    <select id="fRoute">
      <option value="S_LA">Sabanilla → Los Ángeles</option>
      <option value="LA_S">Los Ángeles → Sabanilla</option>
      <option value="S_SL">Sabanilla → San Luis</option>
      <option value="SL_S">San Luis → Sabanilla</option>
      <option value="S_EC">Sabanilla → El Cerro</option>
      <option value="EC_S">El Cerro → Sabanilla</option>
    </select>
    <button class="btn primary" id="fSave" style="margin-top:4px">Registrar y salir a ruta</button>
  </div>`;

  html += `<div class="hint">Elegí cuál buseta manejás hoy:</div>`;
  buses.forEach(b=>{
    const c=ROUTES[b.routeKey].color; const sel=b.id===myBusId;
    html += `<div class="card" data-pick="${b.id}" style="${sel?'border-color:'+c:''}">
      <div class="badge" style="background:${c}">🚐</div>
      <div class="meta"><div class="t">${b.driver} ${sel?'· (vos)':''}</div>
      <div class="s">${b.plate} · ${ROUTES[b.routeKey].name}</div></div>
      <div class="eta"><div class="u" style="font-size:11px">${sel?'ACTIVA':'ELEGIR'}</div></div>
    </div>`;
  });

  if(my){
    html += `<div class="switchrow" style="margin-top:12px">
      <div class="l"><div class="t">Compartir mi ubicación (GPS real)</div>
      <div class="s">${my.gps?'Transmitiendo tu posición real':'Usando posición simulada'}</div></div>
      <button class="toggle ${my.gps?'on':''}" id="gpsTgl"></button>
    </div>`;
    const waiting = pins.filter(p=>p.status==='waiting');
    const onboard = pins.filter(p=>p.status==='onboard');

    html += `<div class="grouplabel">Esperando <span class="count">${waiting.length}</span></div>`;
    if(waiting.length===0){
      html += `<div class="empty">Nadie esperando por ahora.<br>Cambiá a <b>Cliente</b> y tocá el mapa para simularlo.</div>`;
    } else {
      waiting.forEach(p=>{
        const eta=etaMin(my.marker.getLatLng(),[p.lat,p.lng]);
        html += `<div class="card" data-pin="${p.id}">
          <div class="badge" style="background:var(--teal)">🙋</div>
          <div class="meta"><div class="t">${p.name}</div>
          <div class="s">${haversine(my.marker.getLatLng(),[p.lat,p.lng]).toFixed(1)} km · ${eta} min</div></div>
          <button class="mini go" data-pick-up="${p.id}">Recoger</button>
        </div>`;
      });
    }

    if(onboard.length>0){
      const selCount=onboard.filter(p=>selected.has(p.id)).length;
      html += `<div class="grouplabel">A bordo <span class="count">${onboard.length}</span></div>`;
      onboard.forEach(p=>{
        html += `<div class="card">
          <input type="checkbox" class="chk" data-sel="${p.id}" ${selected.has(p.id)?'checked':''}/>
          <div class="badge" style="background:var(--emerald)">🧒</div>
          <div class="meta"><div class="t">${p.name}</div>
          <div class="s">📍 ${p.pickupAddr||'A bordo'}</div></div>
        </div>`;
      });
      html += `<div class="actions" style="margin-top:10px">
        <button class="btn ${selCount?'drop':'ghost'}" id="dropSel" ${selCount?'':'disabled'}>Dejar seleccionados (${selCount})</button>
        <button class="btn primary" id="dropAll">🏫 Dejar todos</button>
      </div>`;
    }
  } else {
    html += `<div class="empty" style="margin-top:8px">Elegí una buseta arriba para empezar a transmitir.</div>`;
  }
  body.innerHTML=html;

  $('#toggleForm').onclick=()=>{ showForm=!showForm; render(); };
  if($('#fSave')) $('#fSave').onclick=()=>{
    const n=$('#fName').value.trim(), pl=$('#fPlate').value.trim(), rt=$('#fRoute').value;
    if(!n||!pl){ alert('Completá nombre y placa.'); return; }
    const b=makeBus(n,pl,rt,0); myBusId=b.id; showForm=false;
    focusBus(b); render();
  };
  body.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{
    myBusId=el.dataset.pick; const b=buses.find(x=>x.id===myBusId); focusBus(b); render();
  });
  body.querySelectorAll('[data-pin]').forEach(el=>el.onclick=()=>{
    const p=pins.find(x=>x.id==el.dataset.pin); if(p&&p.marker._map) map.flyTo([p.lat,p.lng],15);
  });
  body.querySelectorAll('[data-pick-up]').forEach(el=>el.onclick=(e)=>{
    e.stopPropagation(); pickUp(pins.find(x=>x.id==el.dataset.pickUp));
  });
  body.querySelectorAll('[data-sel]').forEach(el=>el.onchange=(e)=>{
    e.stopPropagation(); const id=Number(el.dataset.sel);
    if(el.checked) selected.add(id); else selected.delete(id); render();
  });
  if($('#dropSel')) $('#dropSel').onclick=()=>openDropModal([...selected]);
  if($('#dropAll')) $('#dropAll').onclick=()=>openDropModal(pins.filter(p=>p.status==='onboard').map(p=>p.id));
  if($('#gpsTgl')) $('#gpsTgl').onclick=()=>toggleGps(my);

  body.insertAdjacentHTML('beforeend','<a href="#" class="logout" id="logout">Cerrar sesión de conductor</a>');
  $('#logout').onclick=e=>{e.preventDefault();driverAuth=false;render();};
}

function renderDriverLogin(body){
  $('#sheetTitle').textContent='Acceso conductor';
  $('#sheetSub').textContent='Ingresá tu clave para administrar tu buseta.';
  body.innerHTML=`
    <div class="form show" style="align-items:stretch">
      <div class="lock">🔒</div>
      <label>Clave de acceso</label>
      <input id="drvKey" type="password" placeholder="••••••••" autocomplete="off"/>
      <button class="btn primary" id="drvEnter" style="margin-top:4px">Ingresar</button>
      <div class="err" id="drvErr"></div>
    </div>`;
  const go=()=>{
    if($('#drvKey').value===DRIVER_KEY){ driverAuth=true; render(); }
    else { $('#drvErr').textContent='Clave incorrecta. Intentá de nuevo.'; $('#drvKey').value=''; $('#drvKey').focus(); }
  };
  $('#drvEnter').onclick=go;
  $('#drvKey').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  setTimeout(()=>$('#drvKey').focus(),50);
}

/* ---------------- ADMIN ---------------- */
function renderAdmin(body){
  if(!adminAuth){ renderAdminLogin(body); return; }
  $('#sheetTitle').textContent='Panel de administrador';
  $('#sheetSub').textContent='Reportes históricos de entregas de pasajeros.';

  const total=reports.length;
  const byDest={}; PLACES.forEach(p=>byDest[p]=0);
  reports.forEach(r=>{ byDest[r.destination]=(byDest[r.destination]||0)+1; });
  const topDest = total ? Object.entries(byDest).sort((a,b)=>b[1]-a[1])[0][0] : '—';

  let html=`<div class="stat">
    <div class="box"><div class="n">${total}</div><div class="l">ENTREGAS</div></div>
    <div class="box"><div class="n">${new Set(reports.map(r=>r.passenger)).size}</div><div class="l">PASAJEROS</div></div>
    <div class="box"><div class="n" style="font-size:14px;line-height:1.5">${topDest}</div><div class="l">DESTINO TOP</div></div>
  </div>`;

  html+=`<div class="grouplabel">Historial ${total?`<span class="count">${total}</span>`:''}</div>`;
  if(total===0){
    html+=`<div class="empty">Aún no hay entregas registradas.<br>En <b>Conductor</b>, recogé y luego dejá pasajeros eligiendo el destino.</div>`;
  } else {
    [...reports].reverse().forEach(r=>{
      const hh=r.time.toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'});
      html+=`<div class="rep">
        <div class="time">${hh}</div>
        <div class="who"><div class="t">${r.passenger}</div>
        <div class="s">📍 Recogió: ${r.pickupAddr||'—'}</div>
        <div class="s">🏁 Dejó: ${r.dropAddr||'—'}</div>
        <div class="s">${r.driver} · ${r.plate}</div></div>
        <div class="dest">${r.destination}</div>
      </div>`;
    });
    html+=`<div class="actions" style="margin-top:10px">
      <button class="btn ghost" id="expCsv">⬇️ Exportar CSV</button>
      <button class="btn ghost" id="clrRep">Limpiar historial</button>
    </div>`;
  }
  html+=`<div class="hint" style="margin-top:10px">Nota: por ahora los reportes viven en memoria y se borran al recargar. Con backend (Supabase) quedarían guardados y accesibles desde cualquier dispositivo.</div>`;
  body.innerHTML=html;

  if($('#clrRep')) $('#clrRep').onclick=()=>{ if(confirm('¿Borrar todo el historial?')){reports.length=0;render();} };
  if($('#expCsv')) $('#expCsv').onclick=exportCsv;

  body.insertAdjacentHTML('beforeend','<a href="#" class="logout" id="logoutA">Cerrar sesión de admin</a>');
  $('#logoutA').onclick=e=>{e.preventDefault();adminAuth=false;render();};
}

function exportCsv(){
  const rows=[['Fecha','Hora','Pasajero','Destino','Dirección recogida','Dirección entrega','Coordenadas entrega','Conductor','Placa']];
  reports.forEach(r=>rows.push([
    r.time.toLocaleDateString('es-CR'), r.time.toLocaleTimeString('es-CR'),
    r.passenger, r.destination, r.pickupAddr||'', r.dropAddr||'',
    r.dropCoords?r.dropCoords.join(' '):'', r.driver, r.plate ]));
  const csv=rows.map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='reporte-busetago.csv'; a.click();
  URL.revokeObjectURL(url);
}

function renderAdminLogin(body){
  $('#sheetTitle').textContent='Acceso administrador';
  $('#sheetSub').textContent='Ingresá la clave para ver los reportes.';
  body.innerHTML=`
    <div class="form show" style="align-items:stretch">
      <div class="lock">📊</div>
      <label>Clave de administrador</label>
      <input id="admKey" type="password" placeholder="••••••••" autocomplete="off"/>
      <button class="btn primary" id="admEnter" style="margin-top:4px">Ingresar</button>
      <div class="err" id="admErr"></div>
    </div>`;
  const go=()=>{
    if($('#admKey').value===ADMIN_KEY){ adminAuth=true; render(); }
    else { $('#admErr').textContent='Clave incorrecta. Intentá de nuevo.'; $('#admKey').value=''; $('#admKey').focus(); }
  };
  $('#admEnter').onclick=go;
  $('#admKey').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  setTimeout(()=>$('#admKey').focus(),50);
}

let watchId=null;
function toggleGps(b){
  if(!b) return;
  if(b.gps){ b.gps=false; if(watchId!=null){navigator.geolocation.clearWatch(watchId);watchId=null;} render(); return; }
  if(!navigator.geolocation){ alert('Sin soporte de GPS en este navegador.'); return; }
  watchId=navigator.geolocation.watchPosition(
    p=>{ b.gps=true; b.marker.setLatLng([p.coords.latitude,p.coords.longitude]);
         map.flyTo([p.coords.latitude,p.coords.longitude],15); render(); },
    ()=>{ alert('No se pudo activar el GPS (permiso denegado). Se mantiene la posición simulada.'); },
    { enableHighAccuracy:true, maximumAge:2000 }
  );
}

/* clock + animation loop */
function tick(){
  buses.forEach(stepBus);
  const modalOpen=document.getElementById('nameModal').classList.contains('show')
                || document.getElementById('destModal').classList.contains('show');
  if(modalOpen) return;
  if(role==='cliente'){ render(); }
  else if(role==='conductor' && driverAuth && !showForm){ render(); }   // live ETAs, but not while typing
  else if(role==='admin' && adminAuth){ render(); }                     // live report list
}
setInterval(tick,1000);
function clock(){ const d=new Date();
  document.title='BusetaGo · '+d.toLocaleTimeString('es-CR',{hour:'2-digit',minute:'2-digit'}); }
setInterval(clock,1000); clock();

render();
</script>
